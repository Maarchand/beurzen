<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beurzen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="sheet"></div>
<script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.innerHTML)a.innerHTML='<h1>Beurzen</h1><p>Fout bij laden: '+e.message+'</p>'});
setTimeout(function(){var a=document.getElementById('app');if(a&&!a.innerHTML)a.innerHTML='<h1>Beurzen</h1><p>De app kon niet starten. Controleer of firebase-config.js klopt en of alle bestanden in de hoofdmap van de repository staan. Open je de pagina via een link (https) en niet als los bestand?</p>'},3000);
</script>
<script type="module" src="script.js"></script>
</body>
</html>
